<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Chessar.io">
  <title>Chessar.io</title>
  <defs>
    <clipPath id="tile"><rect x="2" y="2" width="60" height="60" rx="14"/></clipPath>
  </defs>
  <!-- Endless board: a checker field that runs off every edge of the tile. -->
  <g clip-path="url(#tile)">
    <rect x="0" y="0" width="64" height="64" fill="#2f4a22"/>
    <g fill="#3d5f2c">
      <rect x="-4" y="-4" width="12" height="12"/><rect x="20" y="-4" width="12" height="12"/><rect x="44" y="-4" width="12" height="12"/>
      <rect x="8" y="8" width="12" height="12"/><rect x="32" y="8" width="12" height="12"/><rect x="56" y="8" width="12" height="12"/>
      <rect x="-4" y="20" width="12" height="12"/><rect x="20" y="20" width="12" height="12"/><rect x="44" y="20" width="12" height="12"/>
      <rect x="8" y="32" width="12" height="12"/><rect x="32" y="32" width="12" height="12"/><rect x="56" y="32" width="12" height="12"/>
      <rect x="-4" y="44" width="12" height="12"/><rect x="20" y="44" width="12" height="12"/><rect x="44" y="44" width="12" height="12"/>
      <rect x="8" y="56" width="12" height="12"/><rect x="32" y="56" width="12" height="12"/><rect x="56" y="56" width="12" height="12"/>
    </g>
  </g>
  <!-- Geometric King: cross, crown band, tapered body, base. -->
  <g fill="#f3f1dc" stroke="#16220f" stroke-width="2.4" stroke-linejoin="round">
    <path d="M29.6 7.5h4.8v4.3h4.3v4.6h-4.3v4.1h-4.8v-4.1h-4.3v-4.6h4.3z"/>
    <path d="M17 22.5c4.6-2.6 9.6-3.6 15-3.6s10.4 1 15 3.6l-4.2 9.3H21.2z"/>
    <path d="M22.4 33.6h19.2l3.4 13.6H19z"/>
    <rect x="15.5" y="47.6" width="33" height="7.4" rx="2.4"/>
  </g>
  <!-- Accent: the live square under the King. -->
  <rect x="26" y="49.8" width="12" height="3" rx="1.5" fill="#81b64c"/>
</svg>
